{% extends "base.html" %}

{% block title %}Add Property | StayNear{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-lg border-0">

        <div class="card-body p-5">

            <h2 class="mb-4">
                Add New Property
            </h2>

            <form method="POST"
                  enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Property Name</label>

                        <input
                            type="text"
                            name="property_name"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Property Type</label>

                        <select
                            name="property_type"
                            class="form-select">

                            <option>Hostel</option>
                            <option>PG</option>
                            <option>Flat</option>
                            <option>Room</option>

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label>Address</label>

                    <textarea
                        name="address"
                        class="form-control"
                        rows="3"></textarea>

                </div>

                <div class="row">

                    <div class="col-md-4">

                        <label>City</label>

                        <input
                            type="text"
                            name="city"
                            class="form-control">

                    </div>

                    <div class="col-md-4">

                        <label>Pincode</label>

                        <input
                            type="text"
                            name="pincode"
                            class="form-control">

                    </div>

                    <div class="col-md-4">

                        <label>Available Rooms</label>

                        <input
                            type="number"
                            name="available_rooms"
                            class="form-control"
                            value="1">

                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-6">

                        <label>Monthly Rent</label>

                        <input
                            type="number"
                            name="monthly_rent"
                            class="form-control">

                    </div>

                    <div class="col-md-6">

                        <label>Security Deposit</label>

                        <input
                            type="number"
                            name="security_deposit"
                            class="form-control"
                            value="0">

                    </div>

                </div>

                <div class="mt-3">

                    <label>Description</label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="5"></textarea>

                </div>

                <div class="mt-4">

                    <label>
                        Upload Images
                        (Maximum 4)
                    </label>

                    <input
                        type="file"
                        name="images"
                        class="form-control"
                        multiple
                        accept=".jpg,.jpeg,.png">

                </div>

                <button
                    class="btn btn-success mt-4">

                    Add Property

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
