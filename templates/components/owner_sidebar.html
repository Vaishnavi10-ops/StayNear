========================================== -->

    <div class="owner-logo-text">

</div>

    <!-- ==========================================
         NAVIGATION
    ========================================== -->

    <nav class="owner-navigation">

        <a href="{{ url_for('owner.dashboard') }}"

                <i class="fa-solid fa-chart-line"></i>

            <span class="nav-text">

            <span class="nav-text">
                Add Property
            </span>

        </a>


        <a href="{{ url_for('owner.my_properties') }}"
           class="owner-nav-link {% if request.endpoint == 'owner.my_properties' %}active{% endif %}">

            </span>

            <span class="nav-text">

        <a href="{{ url_for('owner.bookings') }}"
           class="owner-nav-link {% if request.endpoint == 'owner.bookings' %}active{% endif %}">

        <a href="{{ url_for('owner.reviews') }}"

        </a>


        <a href="{{ url_for('owner.profile') }}"
           class="owner-nav-link {% if request.endpoint == 'owner.profile' %}active{% endif %}">

                <i class="fa-solid fa-user"></i>
            </span>

            <span class="nav-text">
                Profile
            </span>

        </a>

         SIDEBAR DECORATION

    </div>
