
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        StayNear Admin
        {% endblock %}
    </title>


    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==========================================
         ADMIN CSS
    =========================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}"
    >

</head>


<body>


<!-- ==============================================
     ADMIN SHELL
================================================ -->

<div class="admin-shell">


    <!-- ==========================================
         SIDEBAR
    =========================================== -->

    <aside class="admin-sidebar">


        <!-- ======================================
             BRAND
        ======================================= -->

        <div class="admin-brand">

            <a
                href="{{ url_for('admin.admin_dashboard') }}"
                class="admin-brand-link"
            >

                <div class="admin-brand-mark">

                    <i class="fa-solid fa-house"></i>

                </div>


                <div class="admin-brand-text">

                    <h2>
                        StayNear
                    </h2>

                    <span>
                        ADMIN
                    </span>

                </div>

            </a>

        </div>


        <!-- ======================================
             NAVIGATION
        ======================================= -->

        <nav class="admin-navigation">


            <!-- Section Label -->

            <div class="admin-nav-label">
                MAIN MENU
            </div>


            <!-- Dashboard -->

            <a
    href="{{ url_for('admin.admin_dashboard') }}"
    class="admin-nav-link
    {% if request.endpoint == 'admin.admin_dashboard' %}
        active
    {% endif %}"
>

                <span class="admin-nav-icon">

                    <i class="fa-solid fa-grid-2"></i>

                </span>

                <span class="admin-nav-text">
                    Dashboard
                </span>

            </a>


            <!-- Properties -->

            <a
                href="{{ url_for('admin.manage_properties') }}"
                class="admin-nav-link
                {% if request.endpoint == 'admin.manage_properties' %}
                    active
                {% endif %}"
            >

                <span class="admin-nav-icon">

                    <i class="fa-solid fa-building"></i>

                </span>

                <span class="admin-nav-text">
                    Properties
                </span>

            </a>


            <!-- Users -->

            <a
                href="{{ url_for('admin.manage_users') }}"
                class="admin-nav-link"
            >

                <span class="admin-nav-icon">

                    <i class="fa-solid fa-users"></i>

                </span>

                <span class="admin-nav-text">
                    Users
                </span>

            </a>


            <!-- Owners -->

            <a
                href="{{ url_for('admin.manage_owners') }}"
                class="admin-nav-link"
            >

                <span class="admin-nav-icon">

                    <i class="fa-solid fa-user-tie"></i>

                </span>

                <span class="admin-nav-text">
                    Owners
                </span>

            </a>


            <!-- Bookings -->

            <a
                href="{{ url_for('admin.manage_bookings') }}"
                class="admin-nav-link"
            >

                <span class="admin-nav-icon">

                    <i class="fa-solid fa-calendar-check"></i>

                </span>

                <span class="admin-nav-text">
                    Bookings
                </span>

            </a>


            <!-- Ratings -->

            <a
                href="{{ url_for('admin.manage_reviews') }}"
                class="admin-nav-link"
            >

                <span class="admin-nav-icon">

                    <i class="fa-solid fa-star"></i>

                </span>

                <span class="admin-nav-text">
                    Ratings
                </span>

            </a>


        </nav>


        <!-- ======================================
             SIDEBAR FOOTER
        ======================================= -->

        <div class="admin-sidebar-footer">


            <!-- Admin Profile -->

            <div class="admin-profile">

                <div class="admin-profile-avatar">

                    <i class="fa-solid fa-user-shield"></i>

                </div>


                <div class="admin-profile-info">

                    <strong>
                        {{ session.get('name', 'Admin') }}
                    </strong>

                    <span>
                        Administrator
                    </span>

                </div>

            </div>


            <!-- Logout -->

            <a
                href="{{ url_for('auth.logout') }}"
                class="admin-logout"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    Logout
                </span>

            </a>


        </div>


    </aside>



    <!-- ==========================================
         MAIN AREA
    =========================================== -->

    <main class="admin-main">


        <!-- ======================================
             PAGE CONTENT
        ======================================= -->

        <div class="admin-content">

            {% block admin_content %}
            {% endblock %}

        </div>


    </main>


</div>


</body>

</html>
